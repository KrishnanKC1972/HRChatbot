<!DOCTYPE html>
<html lang=""en"">
<head>
    <meta charset=""UTF-8"">
    <meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
    <title>HR Agentic RAG Chatbot</title>
    <script src=""https://unpkg.com/react@18/umd/react.development.js""></script>
    <script src=""https://unpkg.com/react-dom@18/umd/react-dom.development.js""></script>
    <script src=""https://unpkg.com/@babel/standalone/babel.min.js""></script>
    <script src=""https://cdn.tailwindcss.com""></script>
    <link rel=""preconnect"" href=""https://fonts.googleapis.com"">
    <link rel=""preconnect"" href=""https://fonts.gstatic.com"" crossorigin>
    <link href=""https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"" rel=""stylesheet"">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .bg-art {
            background-image: url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .bg-overlay {
            background: linear-gradient(135deg, rgba(15,23,42,0.85) 0%, rgba(30,58,138,0.75) 100%);
        }
        .glass {
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .msg-user {
            background: linear-gradient(90deg, rgba(59,130,246,0.4) 0%, rgba(37,99,235,0.3) 100%);
            border-left: 4px solid #3b82f6;
        }
        .msg-bot {
            background: linear-gradient(90deg, rgba(34,197,94,0.4) 0%, rgba(22,163,74,0.3) 100%);
            border-left: 4px solid #22c55e;
        }
        .badge-rag { background: rgba(59,130,246,0.3); color: #bfdbfe; border: 1px solid rgba(59,130,246,0.5); }
        .badge-direct { background: rgba(34,197,94,0.3); color: #bbf7d0; border: 1px solid rgba(34,197,94,0.5); }
        .badge-pass { background: rgba(34,197,94,0.3); color: #bbf7d0; border: 1px solid rgba(34,197,94,0.5); }
        .badge-fail { background: rgba(239,68,68,0.3); color: #fecaca; border: 1px solid rgba(239,68,68,0.5); }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .animate-pulse-slow { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
    </style>
</head>
<body class=""bg-art min-h-screen text-slate-100"">
    <div class=""bg-overlay min-h-screen flex flex-col"">
        <header class=""glass mx-4 mt-4 rounded-xl p-6 shadow-xl"">
            <h1 class=""text-3xl md:text-4xl font-bold text-white tracking-tight"">HR Policy Assistant</h1>
            <p class=""text-sky-200 mt-2 text-sm md:text-base"">Agentic RAG • Intelligent Routing • Automated Evaluation</p>
        </header>
        <div id=""root"" class=""flex-1 flex flex-col""></div>
    </div>
</body>
</html>
